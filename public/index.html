<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DIAGNOSTICO ADAX - IA Radiológica</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #0056b3; }
        h1 { color: #0056b3; text-align: center; }
        .controls { display: grid; gap: 15px; margin-bottom: 20px; }
        select, input, button { padding: 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #0056b3; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #004494; }
        #resultado { white-space: pre-wrap; background: #e9ecef; padding: 20px; border-radius: 5px; min-height: 100px; border-left: 5px solid #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DIAGNOSTICO ADAX</h1>
        <div class="controls">
            <input type="file" id="imageInput" accept="image/*">
            <select id="tipoEstudio">
                <option value="RX">Radiografía (RX)</option>
                <option value="TC">Tomografía (TC)</option>
                <option value="RM">Resonancia (RM)</option>
            </select>
            <input type="text" id="region" placeholder="Región (Ej: Tórax, Mano, Cráneo)">
            <button onclick="procesar()">Generar Informe con IA</button>
        </div>
        <div id="resultado">El informe aparecerá aquí...</div>
    </div>

    <script>
        // LA FUNCIÓN DE OPTIMIZACIÓN MAESTRA
        function optimizarImagen(base64Str) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const MAX_SIZE = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const result = canvas.toDataURL('image/jpeg', 0.7);
                    canvas.width = 0; canvas.height = 0; // Liberar memoria
                    resolve(result);
                };
                img.onerror = () => reject("Error al cargar la imagen");
            });
        }

        async function procesar() {
            const file = document.getElementById('imageInput').files[0];
            const estudio = document.getElementById('tipoEstudio').value;
            const region = document.getElementById('region').value;
            const resDiv = document.getElementById('resultado');

            if (!file) return alert("Por favor sube una imagen");
            resDiv.innerText = "Optimizando imagen y analizando con ADAX IA...";

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const imagenOptimizada = await optimizarImagen(e.target.result);
                    
                    const response = await fetch('/analizar-imagen', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imagenOptimizada, region, estudio })
                    });

                    const data = await response.json();
                    resDiv.innerText = data.texto;
                } catch (err) {
                    resDiv.innerText = "Error: " + err;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
